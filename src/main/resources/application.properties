spring.application.name=ai-job-application-assistant

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

spring.datasource.url=jdbc:postgresql://localhost:5432/ai_job_assistant
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

llm.api.base-url=${LLM_BASE_URL:https://api.openai.com/v1}
llm.api.key=${LLM_API_KEY:dummy-key}
llm.api.model=${LLM_MODEL:gpt-4o-mini}
llm.api.timeout-seconds=45